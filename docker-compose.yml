# Environnement LOCAL : nginx (HTTPS) -> API (HTTP interne) -> SQL Server.
# Lancement : copier .env.example en .env, renseigner les valeurs, puis `docker compose up --build`.
# L'API est joignable sur https://localhost:${HTTPS_PORT:-9443} (certificat auto-signé).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Définir SQL_PASSWORD dans .env}
    ports:
      - "127.0.0.1:14333:1433"   # accès depuis ton PC uniquement (SSMS : localhost,14333)
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    # Pas de "ports" : l'API n'est joignable que par nginx, sur le réseau interne Docker.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Fait confiance aux en-têtes X-Forwarded-* envoyés par nginx (schéma https, IP du client).
      # Acceptable ici car l'API n'est pas exposée directement.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__MigApiDbConnectionString: "Server=sqlserver;Database=MigApiDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Définir JWT_SIGNING_KEY dans .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Définir SEED_ADMIN_EMAIL dans .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Définir SEED_ADMIN_PASSWORD dans .env}
      ApplyMigrationsOnStartup: "true"   # crée / met à jour le schéma au démarrage (local uniquement)
      SeedDemoData: "true"               # clients de démonstration (local uniquement)

  # Génère une seule fois un certificat auto-signé (volume « certs »), puis s'arrête.
  certgen:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        [ -f /certs/server.crt ] || openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout /certs/server.key -out /certs/server.crt -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - certs:/certs

  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_started
      certgen:
        condition: service_completed_successfully
    ports:
      - "${HTTPS_PORT:-9443}:443"   # port côté PC ; 8443 est évité car utilisé par la redirection VirtualBox
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro

volumes:
  sqldata:
  certs:
