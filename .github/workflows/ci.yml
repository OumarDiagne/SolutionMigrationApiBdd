name: CI

on:
  push:
    branches: [main]
  pull_request:
env:
 TESTS_MINIMUM : 100
jobs:
  tests:
    name: Build et tests (unitaires + intégration)
    runs-on: ubuntu-latest

    # SQL Server jetable pour les tests d'intégration (mot de passe de test uniquement, conteneur éphémère).
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd!123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!123' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Les tests d'intégration créent leur propre base (MigApiTests_<guid>) et la suppriment à la fin.
      MIGAPI_TEST_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Test_Passw0rd!123;TrustServerCertificate=true"

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restauration des paquets
        run: dotnet restore SolutionMigrationApiBdd.sln

      - name: Compilation
        run: dotnet build SolutionMigrationApiBdd.sln --configuration Release --no-restore

      - name: Tests
        run: dotnet test MigrationApiBdd.Tests/MigrationApiBdd.Tests.csproj -c Release --no-build --logger trx --results-directory ./resultats --verbosity normal

      # Garde-fou : un « vert » sans test exécuté ne doit pas passer inaperçu.
      - name: Vérification que les tests se sont réellement exécutés
        if: always()
        run: |
          fichier=$(ls resultats/*.trx 2>/dev/null | head -n 1)
          if [ -z "$fichier" ]; then
            echo "::error::Aucun résultat de test : les tests ne se sont pas exécutés."
            exit 1
          fi
          total=$(grep -o 'total="[0-9]*"' "$fichier" | head -n 1 | grep -o '[0-9]*')
          echo "Tests exécutés : $total"
          if [ -z "$total" ] || [ "$total" -lt ${{ env.TESTS_MINIMUM }} ]; then
            echo "::error::Trop peu de tests exécutés ($total)."
            exit 1
          fi

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: resultats/*.trx

  docker:
    name: Image Docker (build, et publication sur GHCR depuis main)
    needs: tests
    runs-on: ubuntu-latest

    # Droits du GITHUB_TOKEN pour ce job : lire le code, écrire dans le registre de paquets.
    permissions:
      contents: read
      packages: write

    env:
      # Publication uniquement sur un push sur main (pas sur les pull requests).
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Préparation de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule le nom (en minuscules) et les tags : sha-<commit> et latest sur main.
      - name: Nom et tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (et push si main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLIER == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Déploiement sur Azure Container Apps (depuis main)
    needs: docker
    # Uniquement sur un push sur main, jamais sur une pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Un seul déploiement à la fois, sans annuler celui en cours.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false

    permissions:
      id-token: write   # autorise GitHub à émettre le jeton OIDC présenté à Azure
      contents: read

    steps:
      - name: Connexion à Azure (identité fédérée, sans mot de passe)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Même tag que celui publié par le job « docker » : sha- + 7 premiers caractères du commit.
      - name: Mise à jour de ca-migapi avec l'image du commit
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "Déploiement de $IMAGE"
          az containerapp update -g rg-migapi -n ca-migapi --image "$IMAGE"

      # Contrôle : la nouvelle révision doit répondre (réessaie jusqu'à 3 minutes).
      - name: Vérification que l'application répond
        run: |
          FQDN=$(az containerapp show -g rg-migapi -n ca-migapi --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 12 --retry-delay 15 --retry-all-errors "https://$FQDN/openapi/v1.json" -o /dev/null
          echo "Application disponible sur https://$FQDN"
